name: FriendshubIOS

options:
  bundleIdPrefix: com.somuch-system

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  Friendshub:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.somuch-system.friendshub
        PRODUCT_NAME: FriendsHub
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: FriendsHub
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "FriendsHub использует микрофон для аудиозвонков и голосовых сообщений."
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen:
          ImageRespectSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Slint
                UISceneDelegateClassName: SlintWindowSceneDelegate
    sources: []
    postCompileScripts:
      - name: Build Slint Rust application
        script: ./build_for_ios_with_cargo.bash
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
