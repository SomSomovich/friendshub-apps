[package]
name = "friendshub-apps"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[features]
default = ["native-clipboard", "native-file-picker"]
native-clipboard = [
    "dep:arboard",
    "dep:jni",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-ui-kit",
]

native-file-picker = [
    "dep:jni",
    "dep:native-dialog",
    "dep:mime_guess",
    "dep:tempfile",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-ui-kit",
    "dep:objc2-uniform-type-identifiers",
]

[dependencies]
base64 = "0.23.1"
friendshub-core.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = { version = "0.14.1", default-features = false }
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = { version = "2.0.5", optional = true }
tempfile = { version = "3.24", optional = true }
slint.workspace = true

[build-dependencies]
slint-build.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
slint = { workspace = true, features = ["renderer-skia"] }
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSSet", "NSEnumerator", "NSError", "NSURL"], optional = true }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIPasteboard", "UIApplication", "UIScene", "UISceneDefinitions", "UIWindowScene", "UIWindow", "UIResponder", "UIView", "UIViewController", "UIDocumentPickerViewController", "objc2-uniform-type-identifiers", "block2"], optional = true }

objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType"], optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
native-dialog = { version = "0.9.6", optional = true }
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", default-features = false, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux", target_os = "ios", target_os = "android"))'.dependencies]
cpal = "0.18.2"
ogg = "=0.8.0"
opus = "0.4.0"
webp = { version = "=0.3.1", default-features = false }

[workspace]
members = [
    "platforms/windows",
    "platforms/macos",
    "platforms/ios",
    "platforms/android",
    "platforms/linux",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
friendshub-core = { git = "https://github.com/SomSomovich/friendshub-core", rev = "19e7cb7e206f71855372f8e7dd868393e46e1c5b" }
slint = "1.18.1"
slint-build = "1.18.1"

[patch.crates-io]
# nix 0.31.3 gates macOS-only socket constants for all Apple targets; this upstream commit fixes iOS.
nix = { git = "https://github.com/nix-rust/nix", rev = "f9ba3ed0698255d93240b07ecbf39ecb05a8a5cd" }
